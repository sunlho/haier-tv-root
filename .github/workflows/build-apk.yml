name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: v1.2.0 to sign and publish a Release; leave empty for debug APK'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "$sdk" ]] || { echo 'Android SDK is missing from the runner'; exit 1; }
          # Ubuntu 24.04 includes these packages; install only when necessary.
          if [[ ! -f "$sdk/platforms/android-34/android.jar" ||
                ! -x "$sdk/build-tools/35.0.0/apksigner" ||
                ! -x "$sdk/platform-tools/adb" ]]; then
            manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
            [[ -x "$manager" ]] || { echo 'sdkmanager is missing from the runner'; exit 1; }
            "$manager" 'platform-tools' 'platforms;android-34' 'build-tools;35.0.0'
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v5
      - name: Validate release tag and signing secrets
        if: inputs.release_tag != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a tag such as v1.2.0'; exit 1; }
          missing=0
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing repository secret: $secret. Add it under Settings > Secrets and variables > Actions > New repository secret."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo 'See README: Release signing setup. Leave release_tag empty to build a debug APK without signing secrets.'
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
      - name: Build debug APK and run Lint
        if: inputs.release_tag == ''
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Build signed release APK and run Lint
        if: inputs.release_tag != ''
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintRelease :app:testReleaseUnitTest
      - name: Verify and collect APK
        run: |
          set -euo pipefail
          variant=debug
          [[ -z "$RELEASE_TAG" ]] || variant=release
          apk="app/build/outputs/apk/$variant/app-$variant.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 19 "$apk" | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v1 scheme (JAR signing): true' "$RUNNER_TEMP/signature.txt"
          python3 tools/verify-apk.py "$apk"
          mkdir -p dist
          cp "$apk" "dist/haier-tv-root-$variant.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: haier-tv-root-apk-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
      - name: Upload Lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports-${{ github.run_number }}
          path: app/build/reports/lint-results-*
          if-no-files-found: ignore
      - name: Remove release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  publish:
    if: inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: haier-tv-root-apk-${{ github.run_number }}
          path: dist
      - name: Publish release for the selected commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "海尔TV Root $RELEASE_TAG" \
            --notes '已在海尔 M638 验证；其他型号请先在应用内检测环境。安装及恢复方法见仓库 README。'
